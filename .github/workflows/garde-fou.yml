# Alerte de fuite : à chaque envoi (et chaque jour), vérifie que ce dépôt public ne contient que du code.
# En cas de problème, le contrôle échoue et GitHub envoie un e-mail d'alerte à la propriétaire du dépôt.
name: Garde-fou
on:
  push:
  pull_request:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  SECRETS: 'sk-ant-[A-Za-z0-9_-]{10,}|ghp_[A-Za-z0-9]{20,}|gh[ousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[abp]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY'
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers autorisés seulement
        run: |
          ok='^(\.nojekyll|\.github/workflows/[^/]+\.yml|CLAUDE\.md|index\.html|app\.js|piloter\.js|style\.css|sw\.js|manifest\.webmanifest|icon-(192|512|maskable-512)\.png|icon\.svg|fonts/[a-z0-9-]+\.woff2|fonts/OFL-[A-Za-z]+\.txt)$'
          interdits=$(git ls-files | grep -Ev "$ok" || true)
          if [ -n "$interdits" ]; then echo "::error::Fichiers non autorisés :"; echo "$interdits"; exit 1; fi
      - name: Aucun secret (y compris dans .github)
        run: |
          if git grep -lIE -- "$SECRETS"; then echo "::error::Un secret semble présent."; exit 1; fi
      - name: Aucune adresse e-mail
        run: |
          if git grep -nIiE "[A-Z0-9._%+-]+@[A-Z0-9.-]+\.(fr|com|net|org|io)\b" -- . ':!.github'; then echo "::error::Adresse e-mail trouvée."; exit 1; fi
      - name: Aucun mot de la liste privée (mots entiers)
        # La liste est un secret du dépôt (Settings → Secrets and variables → Actions → MOTS_INTERDITS), mots séparés par | ;
        # elle n'apparaît jamais ici ni dans les journaux. Sans elle, le contrôle échoue.
        env:
          MOTS: ${{ secrets.MOTS_INTERDITS }}
        run: |
          if [ -z "$MOTS" ]; then echo "::error::Secret MOTS_INTERDITS absent : contrôle impossible."; exit 1; fi
          fautifs=$(git grep -lIiwE -- "$MOTS" || true)
          if [ -n "$fautifs" ]; then echo "::error::Mot privé trouvé dans :"; echo "$fautifs"; exit 1; fi
      - name: Icônes inchangées (empreintes sha256)
        run: |
          sha256sum -c --strict <<'FIN'
          43dadb144c51e197ddaa7aea30e317610bfa4ac3d32e6a5944d63d469ca48b40  icon-192.png
          c6a3f5b73ded39387863023f9098c4e2d696fe0b1aa696885d1b1b8f0a359153  icon-512.png
          f83a65da4f6a680c3b8e9cbbbadcfece903db342c41a1573f56ad86ffccb8fc4  icon-maskable-512.png
          FIN
  historique:
    # Chaque jour : tout l'historique public (lignes ajoutées et messages de commit) pour les secrets et les mots privés.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Historique complet
        env:
          MOTS: ${{ secrets.MOTS_INTERDITS }}
        run: |
          if [ -z "$MOTS" ]; then echo "::error::Secret MOTS_INTERDITS absent : contrôle impossible."; exit 1; fi
          git log -p --all --no-color --format='@@commit %H' | awk '/^@@commit /{c=$2; next} /^\+\+\+ /{f=substr($0,7); next} /^\+/{print c" "f"\t"substr($0,2)}' > /tmp/hist
          git log --all --format='%H message%x09%s %b%x00' | tr '\n' ' ' | tr '\0' '\n' >> /tmp/hist
          ko=0
          s=$(grep -E -- "$SECRETS" /tmp/hist | cut -f1 | sort -u || true); if [ -n "$s" ]; then echo "::error::Historique : secret dans :"; echo "$s"; ko=1; fi
          m=$(grep -iwE -- "$MOTS" /tmp/hist | cut -f1 | sort -u || true); if [ -n "$m" ]; then echo "::error::Historique : mot privé dans :"; echo "$m"; ko=1; fi
          exit $ko
